[project]
name = "reversi-workspace"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "reversi-core",
    "reversi-trainer",
]

[tool.uv.workspace]
members = [
    "relay/pyo",
    "py_trainer",
]

[tool.uv.sources]
reversi-core = { workspace = true }
reversi-trainer = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]


[tool.pytest.ini_options]
testpaths = [
    "**/tests/",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["**/src/**/*.py", "**/src/**/*.pyi", "**/tests/**/*.py"]
exclude = ["build", "core", "relay/tauri", "target", "ui"]

[tool.ruff.lint]
select = ["D", "E4", "E7", "E9", "F", "I", "PYI", "ANN", "PYI"]
ignore = [
    "D400", # docstringの1行目が。や.で終わらなくて良い
]
preview = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
known-third-party = [
    "reversi_core",
    "reversi_trainer",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
skip-magic-trailing-comma = true
docstring-code-format = true
docstring-code-line-length = 88

[tool.ty.src]
include = ["**/src", "**/tests"]

[tool.ty.rules]
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-assignment = "error"
unsound-return = "error"
unsound-yield = "error"
unsupported-dynamic-base = "warn"
division-by-zero = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[[tool.ty.overrides]]
include = ["py_trainer/src/reversi_trainer/evaluator.py"]

[tool.ty.overrides.rules]
incompatible-mutable-override = "ignore"
unsound-return = "ignore"
